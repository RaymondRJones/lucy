[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucy-api"
version = "0.1.0"
description = "FastAPI service for Lucy's local marriage-based I-485 packet workflow"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "cryptography>=50.0.0,<51.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "pypdf>=6.10.2,<7.0.0",
  "pydantic-settings>=2.6.1,<3.0.0",
  "python-multipart>=0.0.12,<1.0.0",
  "sqlmodel>=0.0.22,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1.0.0",
  "pillow>=11.0.0,<14.0.0",
  "pypdfium2>=5.0.0,<6.0.0",
  "pytest>=9.0.3,<10.0.0",
  "ruff>=0.13.0,<1.0.0",
  "zxing-cpp>=3.0.0,<4.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "BLE", "S110", "S112"]
# B008 flags FastAPI's standard Depends()/File() defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Validators share helpers through a star import of shared.py, so its imports look unused.
"app/services/filing_validators/*.py" = ["F403", "F405"]
"app/services/filing_validators/shared.py" = ["F401"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
