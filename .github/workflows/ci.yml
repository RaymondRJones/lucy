name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new advisories surface even when no code changes.
    - cron: "0 13 * * 1"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r apps/api/requirements-dev.lock
      - run: ruff check apps/api
      - run: pytest apps/api/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run build:web

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm audit --audit-level=moderate
      - run: pip install pip-audit
      - run: pip-audit -r apps/api/requirements-dev.lock --no-deps --disable-pip
